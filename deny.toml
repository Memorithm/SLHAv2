# cargo-deny policy — supply-chain gate run by the `supply-chain` CI job.
#
# The license allowlist covers exactly what the graph contains today: the
# workspace's own PolyForm-Noncommercial (all five members — maintainer
# decision of 2026-07-30, see LICENSING.md) plus the permissive licenses of
# the dependency tree. Adding a dependency under any other license must be a
# conscious decision: it fails this gate.

[graph]
all-features = true

[advisories]
# RustSec advisories are also checked by `cargo audit`; keeping both means a
# stale local advisory DB in one tool cannot silently pass the other.
version = 2

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "PolyForm-Noncommercial-1.0.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
