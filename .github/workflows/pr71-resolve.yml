name: Resolve PR71 onto current master

on:
  push:
    branches:
      - fix/pr71-rebased-audit-installer

permissions:
  contents: write

jobs:
  resolve:
    if: ${{ !contains(github.event.head_commit.message, '[pr71-resolution]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
          targets: aarch64-unknown-linux-gnu
      - name: Merge and resolve PR 71
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feat/llama-compressed-score-quality-gate:refs/remotes/origin/pr71

          set +e
          git merge --no-commit --no-ff refs/remotes/origin/pr71
          merge_rc=$?
          set -e
          if [ "$merge_rc" -eq 0 ]; then
            echo "Unexpected clean merge; continuing with policy adjustments."
          fi

          # Resolve actual conflicts in favor of the current master integration
          # where PR #71's fused-QK NO-GO experiment would otherwise overwrite
          # calibration, oracle and ranking functionality already merged.
          git checkout --ours -- \
            Cargo.lock \
            integration/llama.cpp/README.md \
            integration/llama.cpp/build_and_roundtrip.sh \
            integration/llama.cpp/shim/slha_llama.cpp \
            integration/llama.cpp/shim/slha_llama.hpp \
            slha-python/Cargo.toml
          git add \
            Cargo.lock \
            integration/llama.cpp/README.md \
            integration/llama.cpp/build_and_roundtrip.sh \
            integration/llama.cpp/shim/slha_llama.cpp \
            integration/llama.cpp/shim/slha_llama.hpp \
            slha-python/Cargo.toml

          # This file merged automatically, but its PR text claims fused-QK is
          # present. Restore master because that path is intentionally split out.
          git restore --source=HEAD --staged --worktree docs/INTEGRATION.md

          # The monolithic module was deliberately replaced by the modular
          # directory implementation on the PR branch.
          git rm -f scirust/src/attention/slha_v2.rs

          # Keep the clarified license comment from the PR.
          git checkout --theirs -- slhav2-vram/Cargo.toml
          git add slhav2-vram/Cargo.toml

          # The slha-c conflict is test-only: retain both independently added
          # suites with a union merge. Production changes merged normally.
          git show :2:slha-c/src/lib.rs > /tmp/slha-c-ours.rs
          git show :1:slha-c/src/lib.rs > /tmp/slha-c-base.rs
          git show :3:slha-c/src/lib.rs > /tmp/slha-c-theirs.rs
          git merge-file --union /tmp/slha-c-ours.rs /tmp/slha-c-base.rs /tmp/slha-c-theirs.rs || true
          cp /tmp/slha-c-ours.rs slha-c/src/lib.rs
          git add slha-c/src/lib.rs

          # Combine fail-closed codec validation from PR #71 with the SIMD
          # delegation already merged on master.
          git checkout --theirs -- slhav2-vram/src/mem/tile.rs
          python3 - <<'PY'
          from pathlib import Path
          path = Path('slhav2-vram/src/mem/tile.rs')
          text = path.read_text()
          old = '''    fn score_unchecked(&self, q_coarse: &[f32], q_sign: &[u64]) -> f32 {
              let latent = self.latent();
              let scale = self.scale();
              let gscales = self.group_scales();
              let flags = self.flags();
              if self.is_warm() {
                  codec::score_warm(q_coarse, latent, scale, gscales, flags)
              } else {
                  let residual = self.residual();
                  codec::score_hot(
                      q_coarse,
                      q_sign,
                      latent,
                      &residual,
                      scale,
                      self.dynamic_lambda(),
                      gscales,
                      flags,
                  )
              }
          }
          '''
          new = '''    fn score_unchecked(&self, q_coarse: &[f32], q_sign: &[u64]) -> f32 {
              let q_coarse: &[f32; codec::D_C] = q_coarse
                  .try_into()
                  .expect("q_coarse slice must be exactly D_C elements");
              let q_sign: &[u64; codec::RESIDUAL_WORDS] = q_sign
                  .try_into()
                  .expect("q_sign slice must be exactly RESIDUAL_WORDS elements");
              self.to_slha_tile().compute_score(q_coarse, q_sign)
          }
          '''
          if old not in text:
              raise SystemExit('score_unchecked anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git add slhav2-vram/src/mem/tile.rs

          # Remove the fused-QK patch from this remediation/installer branch.
          git rm -f integration/llama.cpp/patches/0002-slha-fused-qk.patch

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            printf 'Unresolved files:\n%s\n' "$unresolved"
            exit 2
          fi

          cargo generate-lockfile
          cargo fmt --all

          set +e
          {
            echo '== cargo fmt =='
            cargo fmt --all -- --check
            echo '== cargo check =='
            cargo check --workspace --all-targets --all-features
            echo '== cargo clippy =='
            cargo clippy --workspace --all-targets --all-features -- -D warnings
            echo '== cargo test =='
            cargo test --workspace --all-features
            echo '== llama shim tests =='
            make -C integration/llama.cpp/tests -j"$(nproc)" all test
          } > /tmp/pr71-validation.log 2>&1
          validation_rc=$?
          set -e

          mkdir -p .pr71-resolution
          cp /tmp/pr71-validation.log .pr71-resolution/validation.log
          {
            echo "# PR 71 resolution status"
            echo
            echo "- source: a3b3272e8a6bab3bd11234913c8de7a49c80e603"
            echo "- base: 70c3a4f8b20a00bc43ce8e923398392793d717d6"
            echo "- validation_exit_code: $validation_rc"
            echo "- fused_qk_split_out: true"
            echo "- unresolved_conflicts: 0"
          } > .pr71-resolution/STATUS.md

          git rm -f .github/workflows/pr71-resolve.yml
          git add -A
          if [ "$validation_rc" -eq 0 ]; then
            git commit -m "fix: rebase PR 71 remediation and installer onto master [pr71-resolution]"
          else
            git commit -m "wip: record PR 71 rebased validation failure [pr71-resolution]"
          fi
          git push origin HEAD:fix/pr71-rebased-audit-installer
