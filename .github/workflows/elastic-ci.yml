name: Elastic CI

on:
  push:
    paths:
      - "elastic/**"
      - "Cargo.toml"
      - ".github/workflows/elastic-ci.yml"
  pull_request:
    paths:
      - "elastic/**"
      - "Cargo.toml"
      - ".github/workflows/elastic-ci.yml"

permissions:
  contents: read

concurrency:
  group: elastic-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  stable:
    name: Elastic workspace (stable)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elastic
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo --locked fmt --all --check
      - name: Clippy (warnings = errors, all targets)
        run: cargo --locked clippy --workspace --all-targets --all-features -- -D warnings
      - name: Build all targets
        run: cargo --locked build --workspace --all-targets --all-features
      - name: Tests and doctests
        run: cargo --locked test --workspace --all-features
      - name: Docs (warnings = errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo --locked doc --workspace --all-features --no-deps

  msrv:
    name: Elastic MSRV (Rust 1.89)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elastic
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
      - name: Check workspace on declared MSRV
        run: cargo --locked check --workspace --all-targets --all-features

  rustsec:
    name: Elastic RustSec
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elastic
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit standalone Elastic lockfile
        run: cargo audit
