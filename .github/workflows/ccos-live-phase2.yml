name: CCOS live llama bridge phase 2

on:
  push:
    branches:
      - feat/llama-ccos-live-k

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt,clippy

      - name: Apply live llama bridge
        run: python3 tools/apply_ccos_live_llama.py

      - name: Rust quality gates for the C ABI
        run: |
          cargo fmt --all -- --check
          cargo build --locked --release -p slha-c
          cargo test --locked -p slhav2-vram -p slha-c
          cargo clippy --locked -p slhav2-vram -p slha-c --all-targets -- -D warnings

      - name: Build pinned llama.cpp dependency for shim tests
        run: |
          git clone --depth 1 --branch b9860 https://github.com/ggml-org/llama.cpp "$RUNNER_TEMP/llama.cpp"
          test "$(git -C "$RUNNER_TEMP/llama.cpp" rev-parse HEAD)" = fdb1db877c526ec90f668eca1b858da5dba85560
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama.cpp/build" \
            -DGGML_NATIVE=OFF -DGGML_CUDA=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/llama.cpp/build" -j2 --target llama

      - name: Build and run strict shim suite
        run: |
          make -C integration/llama.cpp/tests -j2 clean all test \
            LLAMA_CPP_DIR="$RUNNER_TEMP/llama.cpp" \
            SLHA_LIB="$GITHUB_WORKSPACE/target/release/libslha.a"
          make -C integration/llama.cpp/tests compile-check \
            LLAMA_CPP_DIR="$RUNNER_TEMP/llama.cpp"

      - name: Build the actually patched reference engine
        run: |
          PATCHED="$RUNNER_TEMP/llama-patched"
          cp -a "$RUNNER_TEMP/llama.cpp" "$PATCHED"
          git -C "$PATCHED" reset --hard fdb1db877c526ec90f668eca1b858da5dba85560
          git -C "$PATCHED" clean -fdx
          normalize_patch() {
            awk '/^diff --git / { in_hunk = 0 } /^@@ / { in_hunk = 1 } { if (in_hunk && length($0) == 0) print " "; else print $0 }' "$1" > "$2"
          }
          for id in 0001-slha-k-passthrough 0002-slha-external-k 0003-slha-external-k-hardening; do
            normalize_patch "integration/llama.cpp/patches/$id.patch" "$RUNNER_TEMP/$id.patch"
            git -C "$PATCHED" apply --recount --check "$RUNNER_TEMP/$id.patch"
            git -C "$PATCHED" apply --recount "$RUNNER_TEMP/$id.patch"
          done
          for shim in \
            slha_llama.hpp slha_llama.cpp slha_external_k.hpp slha_external_k.cpp \
            slha_replace_counters.hpp slha_replace_counters.cpp \
            slha_layer_mask.hpp slha_layer_mask.cpp slha_score_scale.hpp slha_score_scale.cpp \
            slha_scale_fit.hpp slha_scale_fit.cpp slha_score_oracle.hpp slha_score_oracle.cpp \
            slha_oracle_metrics.hpp slha_oracle_metrics.cpp slha_rank_dataset.hpp slha_rank_dataset.cpp; do
            cp "integration/llama.cpp/shim/$shim" "$PATCHED/src/$shim"
          done
          cmake -S "$PATCHED" -B "$PATCHED/build" \
            -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF -DSLHA_INTEGRATION=ON \
            -DSLHA_INCLUDE_DIR="$GITHUB_WORKSPACE/slha-c/include" \
            -DSLHA_LIB="$GITHUB_WORKSPACE/target/release/libslha.a" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$PATCHED/build" -j2 --target llama llama-cli

      - name: Commit validated bridge and remove bootstrap artifacts
        run: |
          git diff --check
          git config user.name "MEMOPERF"
          git config user.email "contact@checkupauto.fr"
          git rm tools/apply_ccos_live_llama.py .github/workflows/ccos-live-phase2.yml
          git add integration/llama.cpp/shim/slha_llama.cpp
          git diff --cached --check
          git commit -m "feat(ccos): connect llama external-K to elastic cache"
          git push origin HEAD:feat/llama-ccos-live-k
