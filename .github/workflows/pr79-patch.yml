name: PR79 patch Python alignment

on:
  pull_request:
    branches:
      - ci/pr79-patcher

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.pull_request.head.ref == 'fix/pr71-merged-master-v3' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/pr71-merged-master-v3
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt
      - name: Preserve 64-byte tile alignment in PyClass
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('slha-python/src/lib.rs')
          text = path.read_text()
          replacements = {
              '    Ok(PySlhaTile { inner: tile })':
              '    Ok(PySlhaTile {\n        inner: Box::new(tile),\n    })',
              '    pub inner: SciRustSlhaTile,':
              '    pub inner: Box<SciRustSlhaTile>,',
              '        Ok(Self { inner: tile })':
              '        Ok(Self {\n            inner: Box::new(tile),\n        })',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one occurrence, found {count}: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          cargo fmt --all
          cargo check --locked -p slha-python
          python3 -m pip install --quiet "maturin>=1.0,<2.0"
          cd slha-python
          python3 -m maturin build --release --out "$RUNNER_TEMP/wheels"
          python3 -m pip install --quiet --force-reinstall "$RUNNER_TEMP"/wheels/*.whl
          python3 tests/test_binding.py
          cd ..
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add slha-python/src/lib.rs
          git commit -m "fix(python): preserve aligned tile storage"
          git push origin HEAD:fix/pr71-merged-master-v3
