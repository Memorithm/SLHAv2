name: Switch PR71 resolver trigger

on:
  push:
    branches:
      - ci/pr71-merge-resolver-v4

permissions:
  contents: write

jobs:
  switch:
    if: ${{ !contains(github.event.head_commit.message, '[target-switched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Switch to pull_request_target
        run: |
          set -euo pipefail
          sed -i 's/^  pull_request:$/  pull_request_target:/' .github/workflows/pr71-merge-resolver-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr71-switch-target.yml
          git add .github/workflows/pr71-merge-resolver-v4.yml
          git commit -m "ci: run PR71 resolver on conflicted PR [target-switched]"
          git push origin HEAD:ci/pr71-merge-resolver-v4
