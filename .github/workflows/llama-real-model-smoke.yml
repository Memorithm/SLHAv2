name: llama.cpp real-model SLHA smoke

on:
  pull_request:
    paths:
      - "integration/llama.cpp/**"
      - "scirust/**"
      - "slha-c/**"
      - ".github/workflows/llama-real-model-smoke.yml"

permissions:
  contents: read

concurrency:
  group: llama-real-model-smoke-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  real-model-smoke:
    name: TinyStories 15M real autoregressive CCOS external-K
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Download pinned real GGUF and verify SHA-256
        env:
          MODEL_URL: https://huggingface.co/ggml-org/tiny-llamas/resolve/main/stories15M-q8_0.gguf?download=true
          MODEL_SHA256: 2eda49203f2f044f3dddf29a7dd7cc861ef5a0340f518a19613d73ba6d9c06b6
        run: |
          mkdir -p "$RUNNER_TEMP/slha-real-smoke"
          curl --fail --location --retry 3 --retry-delay 2 \
            "$MODEL_URL" \
            -o "$RUNNER_TEMP/slha-real-smoke/stories15M-q8_0.gguf"
          echo "$MODEL_SHA256  $RUNNER_TEMP/slha-real-smoke/stories15M-q8_0.gguf" | sha256sum --check -

      - name: Prepare calibration-only text
        run: |
          python3 - "$RUNNER_TEMP/slha-real-smoke/calibration.txt" <<'PY'
          import sys
          text = (
              "Once upon a time, a small fox lived near a quiet river. "
              "Every morning the fox watched birds cross the bright sky. "
              "One day the fox found a wooden boat and carefully repaired it. "
              "The story continued with simple events, ordinary objects, and short conversations.\n"
          )
          with open(sys.argv[1], "w", encoding="utf-8") as f:
              f.write(text * 120)
          PY
          test -s "$RUNNER_TEMP/slha-real-smoke/calibration.txt"
          test -s integration/llama.cpp/fixtures/tinystories_synthetic_holdout.txt
          test "$(sha256sum "$RUNNER_TEMP/slha-real-smoke/calibration.txt" | awk '{print $1}')" != \
               "$(sha256sum integration/llama.cpp/fixtures/tinystories_synthetic_holdout.txt | awk '{print $1}')"

      - name: Collect real K activations
        env:
          WORK: ${{ runner.temp }}/slha-real-smoke/collect-work
          CALIB_DIR: ${{ runner.temp }}/slha-real-smoke/calibration
          DATA_FILE: ${{ runner.temp }}/slha-real-smoke/calibration.txt
          MODEL_REPO: ggml-org/tiny-llamas
          MODEL_FILE: ${{ runner.temp }}/slha-real-smoke/stories15M-q8_0.gguf
          CHUNKS: "1"
          THREADS: "2"
          SLHA_CALIBRATION_MIN_ROWS: "16"
        run: |
          mkdir -p "$WORK"
          git clone --depth 1 --branch b9860 https://github.com/ggml-org/llama.cpp "$WORK/llama.cpp"
          normalize_patch() {
            awk '
              /^diff --git / { in_hunk = 0 }
              /^@@ / { in_hunk = 1 }
              { if (in_hunk && length($0) == 0) print " "; else print $0 }
            ' "$1" > "$2"
          }
          for patch_id in 0001-slha-k-passthrough 0002-slha-external-k 0003-slha-external-k-hardening; do
            normalize_patch \
              "integration/llama.cpp/patches/$patch_id.patch" \
              "$WORK/$patch_id.normalized.patch"
            git -C "$WORK/llama.cpp" apply --recount --check "$WORK/$patch_id.normalized.patch"
            git -C "$WORK/llama.cpp" apply --recount "$WORK/$patch_id.normalized.patch"
          done
          cp integration/llama.cpp/shim/slha_external_k.hpp "$WORK/llama.cpp/src/"
          cp integration/llama.cpp/shim/slha_external_k.cpp "$WORK/llama.cpp/src/"

          bash integration/llama.cpp/build_and_roundtrip.sh collect
          test -f "$CALIB_DIR/calibration_manifest.json"
          python3 - "$CALIB_DIR/calibration_manifest.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          assert data.get("valid") is True, data
          assert int(data.get("num_layers", 0)) == 6, data
          assert int(data.get("observed_dim", 0)) == 288, data
          print(json.dumps({
              "valid": data.get("valid"),
              "num_layers": data.get("num_layers"),
              "observed_dim": data.get("observed_dim"),
              "accepted_rows": data.get("accepted_rows"),
          }, sort_keys=True))
          PY

      - name: Train six layer projection artifacts
        env:
          WORK: ${{ runner.temp }}/slha-real-smoke/collect-work
          CALIB_DIR: ${{ runner.temp }}/slha-real-smoke/calibration
          WEIGHTS_DIR: ${{ runner.temp }}/slha-real-smoke/weights
          MODEL_REPO: ggml-org/tiny-llamas
          MODEL_FILE: stories15M-q8_0.gguf
          EXPECT_LAYERS: "6"
          SLHA_CALIBRATION_MIN_ROWS: "16"
        run: |
          bash integration/llama.cpp/scripts/train_layer_weights.sh mixed
          test "$(find "$WEIGHTS_DIR" -maxdepth 1 -name 'layer-*.slhw' -type f | wc -l)" -eq 6
          python3 -m json.tool "$WEIGHTS_DIR/manifest.json" >/dev/null

      - name: Run paired baseline and full-HOT physical CCOS decode plus held-out perplexity
        env:
          WORK: ${{ runner.temp }}/slha-real-smoke/pair-work
        run: |
          bash integration/llama.cpp/run_real_pair.sh \
            --model "$RUNNER_TEMP/slha-real-smoke/stories15M-q8_0.gguf" \
            --weights-dir "$RUNNER_TEMP/slha-real-smoke/weights" \
            --prompt "Once upon a time," \
            --max-tokens 8 \
            --context-size 128 \
            --threads 2 \
            --gpu-layers 0 \
            --codec mixed \
            --ccos \
            --perplexity-corpus integration/llama.cpp/fixtures/tinystories_synthetic_holdout.txt \
            --perplexity-chunks 2 \
            --output-dir "$RUNNER_TEMP/slha-real-smoke/evidence-hot"

      - name: Validate full-HOT real-model CCOS and paired perplexity evidence
        run: |
          REPORT="$RUNNER_TEMP/slha-real-smoke/evidence-hot/comparison.json"
          BASE_PPL="$RUNNER_TEMP/slha-real-smoke/evidence-hot/baseline.perplexity.json"
          EXT_PPL="$RUNNER_TEMP/slha-real-smoke/evidence-hot/external.perplexity.json"
          python3 -m json.tool "$REPORT" >/dev/null
          python3 -m json.tool "$BASE_PPL" >/dev/null
          python3 -m json.tool "$EXT_PPL" >/dev/null
          python3 - "$REPORT" "$BASE_PPL" "$EXT_PPL" integration/llama.cpp/fixtures/tinystories_synthetic_holdout.txt <<'PY'
          import hashlib, json, math, sys
          r = json.load(open(sys.argv[1]))
          baseline_ppl = json.load(open(sys.argv[2]))
          external_ppl = json.load(open(sys.argv[3]))
          corpus_path = sys.argv[4]
          corpus_sha = hashlib.sha256(open(corpus_path, "rb").read()).hexdigest()

          assert r["validity"]["external_replace_valid"] is True, r["validity"]
          assert r["quality"]["baseline_generated_tokens"] > 0, r["quality"]
          assert r["quality"]["external_generated_tokens"] > 0, r["quality"]
          assert r["quality"]["next_token_logits"] is not None, r["quality"]
          ppl = r["quality"]["perplexity"]
          assert ppl is not None, r["quality"]
          assert ppl["corpus_sha256"] == corpus_sha, ppl
          for key in ("baseline", "external", "absolute_delta"):
              assert math.isfinite(float(ppl[key])), (key, ppl[key])
          assert float(ppl["baseline"]) > 0.0, ppl
          assert float(ppl["external"]) > 0.0, ppl

          assert baseline_ppl["corpus_sha256"] == corpus_sha, baseline_ppl
          assert external_ppl["corpus_sha256"] == corpus_sha, external_ppl
          assert baseline_ppl["context_size"] == external_ppl["context_size"] == 128
          assert baseline_ppl["batch_size"] == external_ppl["batch_size"] == 128
          assert baseline_ppl["parallel"] == external_ppl["parallel"] == 1
          assert baseline_ppl["chunks_requested"] == external_ppl["chunks_requested"] == 2
          assert external_ppl["external_replace_valid"] is True, external_ppl
          assert external_ppl["external_backend"] == "ccos_elastic", external_ppl

          store = r["memory"]["external_slha_store"]
          assert store is not None, r["memory"]
          assert store.get("backend") == "ccos_elastic", store
          assert store.get("peak_resident_bytes", 0) > 0, store
          assert store.get("score_calls", 0) > 0, store
          assert store.get("compression_ns", 0) > 0, store
          assert store.get("peak_cold_slots") == 0, store
          assert store.get("budget_failures") == 0, store
          assert r["validity"]["ccos_dense_no_cold"] is True, r["validity"]
          print(json.dumps({
              "baseline_perplexity": ppl["baseline"],
              "external_perplexity": ppl["external"],
              "absolute_delta": ppl["absolute_delta"],
              "corpus_sha256": corpus_sha,
              "external_backend": external_ppl["external_backend"],
          }, sort_keys=True))
          PY

      - name: Run WARM budget pressure with quiescent COLD cycle
        env:
          PAIR_WORK: ${{ runner.temp }}/slha-real-smoke/pair-work
          WEIGHTS_DIR: ${{ runner.temp }}/slha-real-smoke/weights
          MODEL: ${{ runner.temp }}/slha-real-smoke/stories15M-q8_0.gguf
          HOT_EVIDENCE: ${{ runner.temp }}/slha-real-smoke/evidence-hot
          PRESSURE_EVIDENCE: ${{ runner.temp }}/slha-real-smoke/evidence-pressure
          PROMPT: "Once upon a time,"
          MAX_TOKENS: "8"
          COLD_CYCLE_STEP: "5"
        run: |
          mkdir -p "$PRESSURE_EVIDENCE"
          WARM_BUDGET="$(python3 - "$HOT_EVIDENCE/baseline.eval.json" "$WEIGHTS_DIR/manifest.json" "$MAX_TOKENS" <<'PY'
          import json, sys
          baseline = json.load(open(sys.argv[1]))
          manifest = json.load(open(sys.argv[2]))
          max_tokens = int(sys.argv[3])
          prompt_tokens = int(baseline["prompt_token_count"])
          layers = int(manifest["num_layers"])
          # Sequential decode can have at most prompt + (max_tokens - 1) K
          # positions resident. 96 B is the exact WARM resident footprint/key.
          max_positions = prompt_tokens + max_tokens - 1
          budget = 96 * layers * max_positions
          if prompt_tokens <= 1 or layers <= 0 or budget <= 0:
              raise SystemExit("invalid dimensions for WARM budget")
          print(budget)
          PY
          )"
          echo "WARM_BUDGET_BYTES=$WARM_BUDGET"

          unset SLHA_SCORE_ORACLE SLHA_ORACLE_METRICS_JSON SLHA_SCALE_FIT_JSON SLHA_RANK_DATASET_DIR
          export SLHA_EXTERNAL_K=1
          export SLHA_KV_MODE=tilestore
          export SLHA_SCORE_MODE=replace
          export SLHA_SCORE_LAYERS=all
          export SLHA_WEIGHTS_DIR="$WEIGHTS_DIR"
          export SLHA_CODEC=mixed
          export SLHA_CCOS=1
          export SLHA_CCOS_BUDGET_BYTES="$WARM_BUDGET"

          set +e
          LC_ALL=C /usr/bin/time \
            -f 'max_rss_kb=%M\nelapsed_s=%e\nuser_s=%U\nsys_s=%S' \
            -o "$PRESSURE_EVIDENCE/external.time" \
            "$PAIR_WORK/slha-real-eval" \
            --model "$MODEL" \
            --prompt "$PROMPT" \
            --output-json "$PRESSURE_EVIDENCE/external.eval.json" \
            --logits-bin "$PRESSURE_EVIDENCE/external.logits.f32" \
            --max-tokens "$MAX_TOKENS" \
            --context-size 128 \
            --threads 2 \
            --gpu-layers 0 \
            --cache-type-k f16 \
            --cache-type-v f16 \
            --ccos-cold-cycle-step "$COLD_CYCLE_STEP" \
            2>&1 | tee "$PRESSURE_EVIDENCE/external.log"
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -eq 0
          python3 -m json.tool "$PRESSURE_EVIDENCE/external.eval.json" >/dev/null

          MODEL_SHA256="$(sha256sum "$MODEL" | awk '{print $1}')"
          PROMPT_SHA256="$(printf '%s' "$PROMPT" | sha256sum | awk '{print $1}')"
          python3 integration/llama.cpp/scripts/compare_real_eval.py \
            --baseline-json "$HOT_EVIDENCE/baseline.eval.json" \
            --external-json "$PRESSURE_EVIDENCE/external.eval.json" \
            --baseline-logits "$HOT_EVIDENCE/baseline.logits.f32" \
            --external-logits "$PRESSURE_EVIDENCE/external.logits.f32" \
            --baseline-time "$HOT_EVIDENCE/baseline.time" \
            --external-time "$PRESSURE_EVIDENCE/external.time" \
            --baseline-log "$HOT_EVIDENCE/baseline.log" \
            --external-log "$PRESSURE_EVIDENCE/external.log" \
            --model "$MODEL" \
            --model-sha256 "$MODEL_SHA256" \
            --prompt-sha256 "$PROMPT_SHA256" \
            --slhav2-commit "$(git rev-parse HEAD)" \
            --llama-commit fdb1db877c526ec90f668eca1b858da5dba85560 \
            --output "$PRESSURE_EVIDENCE/comparison.json"
          echo "$WARM_BUDGET" > "$PRESSURE_EVIDENCE/warm-budget-bytes.txt"

      - name: Validate WARM and quiescent COLD evidence
        env:
          PRESSURE_EVIDENCE: ${{ runner.temp }}/slha-real-smoke/evidence-pressure
        run: |
          REPORT="$PRESSURE_EVIDENCE/comparison.json"
          BUDGET="$(cat "$PRESSURE_EVIDENCE/warm-budget-bytes.txt")"
          python3 -m json.tool "$REPORT" >/dev/null
          python3 - "$REPORT" "$BUDGET" <<'PY'
          import json, math, sys
          r = json.load(open(sys.argv[1]))
          budget = int(sys.argv[2])
          q = r["quality"]
          store = r["memory"]["external_slha_store"]
          lifecycle = r.get("ccos_lifecycle") or {}
          validity = r["validity"]

          assert validity["external_replace_valid"] is True, validity
          assert validity["external_backend"] == "ccos_elastic", validity
          assert store is not None, r["memory"]
          assert int(store.get("hard_budget_bytes", -1)) == budget, store
          assert int(store.get("peak_resident_bytes", budget + 1)) <= budget, store
          assert int(store.get("peak_warm_slots", 0)) > 0, store
          assert int(store.get("peak_cold_slots", 0)) > 0, store
          assert int(store.get("budget_enforcements", 0)) > 0, store
          assert int(store.get("budget_failures", -1)) == 0, store
          assert int(store.get("cold_slots", -1)) == 0, store
          assert int(store.get("quiescent_offload_calls", 0)) == 1, store
          assert int(store.get("quiescent_restore_calls", 0)) == 1, store
          assert int(store.get("quiescent_restored_slots", 0)) > 0, store
          assert int(store.get("quiescent_offload_ns", 0)) > 0, store
          assert int(store.get("quiescent_restore_ns", 0)) > 0, store

          assert lifecycle.get("requested") is True, lifecycle
          assert lifecycle.get("executed") is True, lifecycle
          assert int(lifecycle.get("step", -1)) == 5, lifecycle
          before = lifecycle["before"]
          cold = lifecycle["cold"]
          restored = lifecycle["restored"]
          active = int(before["hot_slots"]) + int(before["warm_slots"]) + int(before["pinned_slots"])
          assert active > 0, lifecycle
          assert int(before["warm_slots"]) > 0, lifecycle
          assert int(before["cold_slots"]) == 0, lifecycle
          assert int(cold["resident_bytes"]) == 0, lifecycle
          assert int(cold["cold_slots"]) == active, lifecycle
          assert int(restored["cold_slots"]) == 0, lifecycle
          for key in ("resident_bytes", "offloaded_bytes", "hot_slots", "warm_slots", "pinned_slots"):
              assert restored[key] == before[key], (key, before, restored)

          assert q["external_generated_tokens"] > 6, q
          logits = q["next_token_logits"]
          assert logits is not None and int(logits["comparable_rows"]) > 0, q
          for key in ("mean_absolute_error", "max_absolute_error", "rmse", "relative_l2"):
              value = logits[key]
              assert value is None or math.isfinite(float(value)), (key, value)

          perf = r["performance"]
          print(json.dumps({
              "warm_budget_bytes": budget,
              "token_agreement": q["aligned_token_agreement_ratio"],
              "first_divergence": q["first_divergence_index"],
              "text_exact_match": q["text_exact_match"],
              "logit_relative_l2": logits["relative_l2"],
              "baseline_decode_tps": perf["baseline_decode_tokens_per_second"],
              "pressure_decode_tps": perf["external_decode_tokens_per_second"],
              "peak_resident_bytes": store["peak_resident_bytes"],
              "peak_offloaded_bytes": store["peak_offloaded_bytes"],
              "peak_hot_slots": store["peak_hot_slots"],
              "peak_warm_slots": store["peak_warm_slots"],
              "peak_cold_slots": store["peak_cold_slots"],
              "evictions": store["evictions"],
              "budget_enforcements": store["budget_enforcements"],
              "quiescent_offload_ns": store["quiescent_offload_ns"],
              "quiescent_restore_ns": store["quiescent_restore_ns"],
          }, sort_keys=True))
          PY
