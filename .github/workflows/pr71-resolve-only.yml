name: PR71 minimal resolver

on:
  push:
    branches:
      - fix/pr71-rebased-audit-installer

permissions:
  contents: write

jobs:
  resolve:
    if: ${{ !contains(github.event.head_commit.message, '[pr71-minimal-result]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Resolve the ten recorded conflicts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feat/llama-compressed-score-quality-gate:refs/remotes/origin/pr71
          git merge --no-commit --no-ff refs/remotes/origin/pr71 || true

          git checkout --ours -- Cargo.lock
          git checkout --ours -- integration/llama.cpp/README.md
          git checkout --ours -- integration/llama.cpp/build_and_roundtrip.sh
          git checkout --ours -- integration/llama.cpp/shim/slha_llama.cpp
          git checkout --ours -- integration/llama.cpp/shim/slha_llama.hpp
          git checkout --ours -- slha-c/src/lib.rs
          git checkout --ours -- slha-python/Cargo.toml
          git checkout --ours -- slhav2-vram/Cargo.toml
          git checkout --ours -- slhav2-vram/src/mem/tile.rs
          git add Cargo.lock
          git add integration/llama.cpp/README.md
          git add integration/llama.cpp/build_and_roundtrip.sh
          git add integration/llama.cpp/shim/slha_llama.cpp
          git add integration/llama.cpp/shim/slha_llama.hpp
          git add slha-c/src/lib.rs
          git add slha-python/Cargo.toml
          git add slhav2-vram/Cargo.toml
          git add slhav2-vram/src/mem/tile.rs

          git rm -f scirust/src/attention/slha_v2.rs
          git restore --source=HEAD --staged --worktree docs/INTEGRATION.md
          git rm -f integration/llama.cpp/patches/0002-slha-fused-qk.patch

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo "Unresolved files:"
            echo "$unresolved"
            exit 1
          fi

          mkdir -p .pr71-resolution
          printf '%s\n' \
            '# PR 71 minimally resolved tree' \
            '' \
            '- resolution_exit_code: 0' \
            '- unresolved_conflicts: 0' \
            '- fused_qk_split_out: true' \
            '- validation_pending: true' \
            > .pr71-resolution/STATUS.md
          git rm -f .github/workflows/pr71-resolve-only.yml
          git rm -f .pr71-resolution/SENTINEL.txt 2>/dev/null || true
          git add -A
          git commit -m "fix: resolve PR 71 tree onto master [pr71-minimal-result]"
          git push origin HEAD:fix/pr71-rebased-audit-installer
