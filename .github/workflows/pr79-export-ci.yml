name: PR79 export patched CI

on:
  pull_request:
    branches:
      - ci/pr79-patcher

permissions:
  contents: write

jobs:
  export:
    if: ${{ github.event.pull_request.head.ref == 'fix/pr71-merged-master-v3' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/pr71-merged-master-v3
          persist-credentials: true
      - name: Export the patched official CI as an ordinary blob
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/ci.yml')
          text = source.read_text()
          marker = '      - name: AArch64 cross-check (NEON path + C-ABI crate)\n'
          gate = '''      - name: Python binding (maturin wheel + runtime test)
            # Cargo-only checks cannot expose ABI/runtime faults in a PyO3
            # extension. Build the actual wheel, install it, and exercise all
            # codecs, scoring, strided buffers, validation errors and audit.
            run: |
              python3 -m pip install --quiet "maturin>=1.0,<2.0"
              cd slha-python
              python3 -m maturin build --release --out "$RUNNER_TEMP/wheels"
              python3 -m pip install --quiet --force-reinstall "$RUNNER_TEMP"/wheels/*.whl
              python3 -X faulthandler -u tests/test_binding.py
          '''
          if 'Python binding (maturin wheel + runtime test)' in text:
              raise SystemExit('gate already present')
          count = text.count(marker)
          if count != 1:
              raise SystemExit(f'expected one insertion marker, found {count}')
          Path('.pr79-ci-output.yml').write_text(text.replace(marker, gate + marker, 1))
          PY
          git diff --check -- .pr79-ci-output.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pr79-ci-output.yml
          git commit -m "chore: export validated CI with Python wheel gate"
          git push origin HEAD:fix/pr71-merged-master-v3
