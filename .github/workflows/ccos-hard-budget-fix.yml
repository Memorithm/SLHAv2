name: CCOS hard-budget invariant fix

on:
  push:
    branches:
      - feat/llama-ccos-live-k
    paths:
      - tools/apply_ccos_hard_budget_fix.py
      - .github/workflows/ccos-hard-budget-fix.yml

permissions:
  contents: write

concurrency:
  group: ccos-hard-budget-fix
  cancel-in-progress: true

jobs:
  validate-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt,clippy

      - name: Apply hard-budget fix
        run: python3 tools/apply_ccos_hard_budget_fix.py

      - name: Rust formatting, tests and Clippy
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked -p slhav2-vram -p slha-c
          cargo clippy --locked -p slhav2-vram -p slha-c --all-targets -- -D warnings
          cargo build --locked --release -p slha-c

      - name: Strict public C header compile
        run: |
          cat > "$RUNNER_TEMP/slha_header_smoke.c" <<'EOF'
          #include "slha.h"
          int main(void) {
              SlhaElasticKvCache *cache = slha_elastic_cache_new(192u);
              (void) cache;
              (void) slha_elastic_cache_write_dense_budget;
              return 0;
          }
          EOF
          cc -std=c11 -Wall -Wextra -Werror -I slha-c/include -fsyntax-only "$RUNNER_TEMP/slha_header_smoke.c"

      - name: Build pinned llama.cpp dependency
        run: |
          git clone --depth 1 --branch b9860 https://github.com/ggml-org/llama.cpp "$RUNNER_TEMP/llama.cpp"
          test "$(git -C "$RUNNER_TEMP/llama.cpp" rev-parse HEAD)" = "fdb1db877c526ec90f668eca1b858da5dba85560"
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama.cpp/build" \
            -DGGML_NATIVE=OFF \
            -DGGML_CUDA=OFF \
            -DLLAMA_CURL=OFF \
            -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build "$RUNNER_TEMP/llama.cpp/build" -j2 --target llama

      - name: Run strict shim suite against real libslha
        run: |
          make -C integration/llama.cpp/tests -j2 all test \
            LLAMA_CPP_DIR="$RUNNER_TEMP/llama.cpp" \
            SLHA_LIB="$GITHUB_WORKSPACE/target/release/libslha.a"
          make -C integration/llama.cpp/tests compile-check \
            LLAMA_CPP_DIR="$RUNNER_TEMP/llama.cpp"

      - name: Build actually patched reference engine
        run: |
          LLAMA="$RUNNER_TEMP/patched-llama.cpp"
          git clone --depth 1 --branch b9860 https://github.com/ggml-org/llama.cpp "$LLAMA"
          test "$(git -C "$LLAMA" rev-parse HEAD)" = "fdb1db877c526ec90f668eca1b858da5dba85560"
          normalize_patch() {
            awk '
              /^diff --git / { in_hunk = 0 }
              /^@@ / { in_hunk = 1 }
              { if (in_hunk && length($0) == 0) print " "; else print $0 }
            ' "$1" > "$2"
          }
          for patch_id in 0001-slha-k-passthrough 0002-slha-external-k 0003-slha-external-k-hardening; do
            normalize_patch \
              "integration/llama.cpp/patches/$patch_id.patch" \
              "$RUNNER_TEMP/$patch_id.patch"
            git -C "$LLAMA" apply --recount --check "$RUNNER_TEMP/$patch_id.patch"
            git -C "$LLAMA" apply --recount "$RUNNER_TEMP/$patch_id.patch"
          done
          for shim in \
            slha_llama.hpp slha_llama.cpp \
            slha_external_k.hpp slha_external_k.cpp \
            slha_replace_counters.hpp slha_replace_counters.cpp \
            slha_layer_mask.hpp slha_layer_mask.cpp \
            slha_score_scale.hpp slha_score_scale.cpp \
            slha_scale_fit.hpp slha_scale_fit.cpp \
            slha_score_oracle.hpp slha_score_oracle.cpp \
            slha_oracle_metrics.hpp slha_oracle_metrics.cpp \
            slha_rank_dataset.hpp slha_rank_dataset.cpp; do
            cp "integration/llama.cpp/shim/$shim" "$LLAMA/src/$shim"
          done
          cmake -S "$LLAMA" -B "$LLAMA/build-slha" \
            -DGGML_NATIVE=OFF \
            -DGGML_CUDA=OFF \
            -DLLAMA_CURL=OFF \
            -DSLHA_INTEGRATION=ON \
            -DSLHA_INCLUDE_DIR="$GITHUB_WORKSPACE/slha-c/include" \
            -DSLHA_LIB="$GITHUB_WORKSPACE/target/release/libslha.a" \
            -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build "$LLAMA/build-slha" -j2 --target llama

      - name: Verify intended diff only
        run: |
          git status --short
          python3 - <<'PY'
          import subprocess
          allowed = {
              'slhav2-vram/src/elastic_cache.rs',
              'slha-c/src/elastic_ffi.rs',
              'slha-c/include/slha.h',
              'integration/llama.cpp/shim/slha_external_k.cpp',
              'integration/llama.cpp/tests/external_k_contract_tests.cpp',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          extra = changed - allowed
          missing = allowed - changed
          if extra or missing:
              raise SystemExit(f'unexpected diff: extra={sorted(extra)} missing={sorted(missing)}')
          PY

      - name: Commit validated invariant fix
        run: |
          git config user.name MEMOPERF
          git config user.email contact@checkupauto.fr
          git add \
            slhav2-vram/src/elastic_cache.rs \
            slha-c/src/elastic_ffi.rs \
            slha-c/include/slha.h \
            integration/llama.cpp/shim/slha_external_k.cpp \
            integration/llama.cpp/tests/external_k_contract_tests.cpp
          git commit -m 'fix(ccos): enforce hard budget during dense writes'
          git push origin HEAD:feat/llama-ccos-live-k
