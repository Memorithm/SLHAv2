name: PR71 fix PyClass alignment

on:
  push:
    branches:
      - feat/llama-compressed-score-quality-gate

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[pyclass-alignment-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - name: Store the over-aligned tile in a Rust allocation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("slha-python/src/lib.rs")
          text = path.read_text()
          replacements = {
              "pub inner: SciRustSlhaTile,": "pub inner: Box<SciRustSlhaTile>,",
              "Ok(PySlhaTile { inner: tile })": "Ok(PySlhaTile {\n        inner: Box::new(tile),\n    })",
              "Ok(Self { inner: tile })": "Ok(Self {\n            inner: Box::new(tile),\n        })",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one occurrence of {old!r}, found {count}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          cargo fmt --all
          cargo check --locked -p slha-python
          git diff --check
      - name: Commit alignment fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr71-fix-pyclass-alignment.yml
          git add slha-python/src/lib.rs
          git commit -m "fix(python): preserve SLHA tile alignment in PyClass [pyclass-alignment-fixed]"
          git push origin HEAD:feat/llama-compressed-score-quality-gate
