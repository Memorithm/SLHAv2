name: P0 large-file correctness patch

on:
  push:
    branches:
      - feat/elastic-architecture-v1
    paths:
      - .github/workflows/p0-large-file-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/elastic-architecture-v1

      - name: Apply exact verified patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              path.write_text(text.replace(old, new, 1))
              print(f"patched {label}")

          cpp = Path("integration/llama.cpp/shim/slha_llama.cpp")

          replace_exact(
              cpp,
              "#include <mutex>\n#include <random>\n",
              "#include <mutex>\n#include <new>\n#include <random>\n#include <stdexcept>\n",
              "llama explicit allocation exception headers",
          )

          old_init_call = r'''            // Capacity per layer: positions are bounded by the KV cache the
            // runtime actually allocates. 16384 remains the documented
            // maximum supported by this tile-store layout; positions beyond
            // it fail closed (write returns false, no silent truncation).
            const size_t capacity = 16384;
            if (!g_slha_tile_store.init(n_layers, capacity, slha_tile_size())) {
                std::cerr << "[SLHA] failed to initialize tile store\n";
                return -1;
            }
'''
          new_init_call = r'''            // Runtime context capacity is not known at global init. Keep only
            // model-derived layer count and tile geometry here; the K-cache
            // allocation hook sizes the store from llama.cpp's actual
            // `n_tokens`. There is deliberately no SLHA-specific 16k/32k/128k
            // context cap.
            if (!g_slha_tile_store.init(n_layers, 0, slha_tile_size())) {
                std::cerr << "[SLHA] failed to initialize empty tile store metadata\n";
                return -1;
            }
'''
          replace_exact(cpp, old_init_call, new_init_call, "llama remove hard-coded 16384 capacity")

          old_store_init = r'''bool slha_tile_store::init(size_t n_layers_, size_t capacity_, size_t tile_bytes_) {
    std::lock_guard<std::mutex> lock(mutex);
    n_layers = n_layers_;
    capacity = capacity_;
    tile_bytes = tile_bytes_;
    if (tile_bytes == 0) {
        return false;
    }
    // 128-aligned tile region: allocate TILE_ALIGN-1 extra bytes and point
    // the tile base at the first 128-aligned offset. Every element of the
    // store then satisfies the `SciRustSlhaTile` alignment regardless of
    // vector growth (the buffer never reallocates after init).
    const size_t total = n_layers * capacity * tile_bytes;
    tiles.assign(total + TILE_ALIGN - 1, 0);
    const uintptr_t raw = reinterpret_cast<uintptr_t>(tiles.data());
    const size_t pad = (TILE_ALIGN - (raw % TILE_ALIGN)) % TILE_ALIGN;
    tile_base_offset = pad;
    valid.assign(n_layers * capacity, 0);
    return true;
}
'''
          new_store_init = r'''namespace {

bool slha_checked_store_geometry(
    size_t n_layers,
    size_t capacity,
    size_t tile_bytes,
    size_t * slots_out,
    size_t * allocation_out
) {
    if (!slots_out || !allocation_out || n_layers == 0 || tile_bytes == 0) {
        return false;
    }
    if (capacity != 0 && n_layers > std::numeric_limits<size_t>::max() / capacity) {
        return false;
    }
    const size_t slots = n_layers * capacity;
    if (slots != 0 && tile_bytes > std::numeric_limits<size_t>::max() / slots) {
        return false;
    }
    const size_t payload = slots * tile_bytes;
    if (payload > std::numeric_limits<size_t>::max() - (slha_tile_store::TILE_ALIGN - 1)) {
        return false;
    }
    *slots_out = slots;
    *allocation_out = payload + slha_tile_store::TILE_ALIGN - 1;
    return true;
}

bool slha_resize_empty_tile_store(
    slha_tile_store & store,
    size_t n_layers,
    size_t capacity,
    size_t tile_bytes
) {
    std::lock_guard<std::mutex> lock(store.mutex);
    if (store.n_layers == n_layers && store.tile_bytes == tile_bytes && store.capacity >= capacity) {
        return true;
    }
    // A resize invalidates pointers returned by read(). It is therefore only
    // legal while the store has no live tiles. Active-context growth must be
    // preceded by the normal llama KV clear/reallocation seam; otherwise fail
    // closed instead of reallocating under readers.
    if (std::any_of(store.valid.begin(), store.valid.end(), [](uint8_t value) { return value != 0; })) {
        return false;
    }

    size_t slots = 0;
    size_t allocation = 0;
    if (!slha_checked_store_geometry(n_layers, capacity, tile_bytes, &slots, &allocation)) {
        return false;
    }
    try {
        std::vector<unsigned char> next_tiles(allocation, 0);
        std::vector<uint8_t> next_valid(slots, 0);
        const uintptr_t raw = reinterpret_cast<uintptr_t>(next_tiles.data());
        const size_t pad = (slha_tile_store::TILE_ALIGN - (raw % slha_tile_store::TILE_ALIGN))
            % slha_tile_store::TILE_ALIGN;
        store.tiles.swap(next_tiles);
        store.valid.swap(next_valid);
        store.tile_base_offset = pad;
        store.n_layers = n_layers;
        store.capacity = capacity;
        store.tile_bytes = tile_bytes;
    } catch (const std::bad_alloc &) {
        return false;
    } catch (const std::length_error &) {
        return false;
    }
    return true;
}

} // namespace

bool slha_tile_store::init(size_t n_layers_, size_t capacity_, size_t tile_bytes_) {
    std::lock_guard<std::mutex> lock(mutex);
    if (std::any_of(valid.begin(), valid.end(), [](uint8_t value) { return value != 0; })) {
        return false;
    }
    size_t slots = 0;
    size_t allocation = 0;
    if (!slha_checked_store_geometry(n_layers_, capacity_, tile_bytes_, &slots, &allocation)) {
        return false;
    }
    try {
        std::vector<unsigned char> next_tiles(allocation, 0);
        std::vector<uint8_t> next_valid(slots, 0);
        const uintptr_t raw = reinterpret_cast<uintptr_t>(next_tiles.data());
        const size_t pad = (TILE_ALIGN - (raw % TILE_ALIGN)) % TILE_ALIGN;
        tiles.swap(next_tiles);
        valid.swap(next_valid);
        tile_base_offset = pad;
        n_layers = n_layers_;
        capacity = capacity_;
        tile_bytes = tile_bytes_;
    } catch (const std::bad_alloc &) {
        return false;
    } catch (const std::length_error &) {
        return false;
    }
    return true;
}
'''
          replace_exact(cpp, old_store_init, new_store_init, "llama checked dynamic tile-store geometry")

          old_intercept = r'''    if (!k_tensor) {
        return;
    }

    const int64_t original_bytes = n_tokens * head_dim * n_kv_heads * static_cast<int64_t>(ggml_type_size(k_tensor->type));
    const int64_t reduced_bytes = n_tokens * 128; // 128 bytes per token (SLHAv2 tile size)

    std::cout << "[SLHA] K-cache hook: GGML tensor keeps its real type/shape ("
              << ggml_type_name(k_tensor->type) << ", " << original_bytes
              << " bytes for " << n_tokens << " tokens x " << head_dim
              << " x " << n_kv_heads << "); SLHA tiles live in the external "
              << "tile store (" << reduced_bytes << " bytes, "
              << (static_cast<double>(original_bytes) / static_cast<double>(std::max<int64_t>(reduced_bytes, 1)))
              << "x projected reduction).\n";
'''
          new_intercept = r'''    if (!k_tensor || n_tokens <= 0 || head_dim <= 0 || n_kv_heads <= 0) {
        std::cerr << "[SLHA] invalid K-cache allocation metadata; refusing to size tile store\n";
        return;
    }

    auto & state = get_global_state();
    size_t n_layers = 0;
    slha_kv_mode kv_mode = SLHA_KV_LEGACY;
    slha_score_mode score_mode = SLHA_SCORE_OFF;
    {
        std::lock_guard<std::mutex> state_lock(state.mutex);
        n_layers = state.layers.size();
        kv_mode = state.kv_mode;
        score_mode = state.score_mode;
    }
    const size_t runtime_capacity = static_cast<size_t>(n_tokens);
    const size_t tile_bytes = slha_tile_size();
    if ((kv_mode == SLHA_KV_TILESTORE || score_mode != SLHA_SCORE_OFF) &&
        !slha_resize_empty_tile_store(g_slha_tile_store, n_layers, runtime_capacity, tile_bytes)) {
        std::cerr << "[SLHA] failed to size tile store from runtime K-cache capacity="
                  << runtime_capacity << "; active data is never reallocated in place\n";
        return;
    }

    const size_t original_layer_bytes = ggml_nbytes(k_tensor);
    if (runtime_capacity > std::numeric_limits<size_t>::max() / tile_bytes) {
        std::cerr << "[SLHA] tile-store byte accounting overflow\n";
        return;
    }
    const size_t reduced_layer_bytes = runtime_capacity * tile_bytes;
    const double reduction = reduced_layer_bytes == 0
        ? 0.0
        : static_cast<double>(original_layer_bytes) / static_cast<double>(reduced_layer_bytes);

    std::cout << "[SLHA] K-cache hook: GGML tensor keeps its real type/shape ("
              << ggml_type_name(k_tensor->type) << ", " << original_layer_bytes
              << " bytes for runtime capacity " << runtime_capacity << " x head_dim "
              << head_dim << " x kv_heads " << n_kv_heads << "); external SLHA "
              << "capacity is derived from the runtime (" << reduced_layer_bytes
              << " bytes/layer, " << reduction << "x projected per-layer reduction).\n";
'''
          replace_exact(cpp, old_intercept, new_intercept, "llama derive capacity from runtime n_tokens")

          cuda = Path("slhav2-vram/src/backends/cuda.rs")
          replace_exact(
              cuda,
              "700 is\n/// `CUDA_ERROR_INVALID_VALUE`",
              "700 is\n/// `CUDA_ERROR_ILLEGAL_ADDRESS`",
              "CUDA error-code documentation",
          )

          owner_anchor = r'''    pub fn backing_allocation_count() -> usize {
        CUDA_BACKING_ALLOCATIONS.load(Ordering::SeqCst)
    }

'''
          owner_helpers = owner_anchor + r'''    fn ensure_allocation_owner(
        &self,
        allocation: &CudaAllocation,
        label: &str,
    ) -> Result<(), CudaError> {
        if Rc::ptr_eq(&self.inner, &allocation.owner) {
            Ok(())
        } else {
            Err(CudaError(format!(
                "{label}: allocation belongs to a different CUDA context"
            )))
        }
    }

    fn ensure_function_owner(
        &self,
        function: &CudaFunction,
        label: &str,
    ) -> Result<(), CudaError> {
        if Rc::ptr_eq(&self.inner, &function.module.owner) {
            Ok(())
        } else {
            Err(CudaError(format!(
                "{label}: kernel belongs to a different CUDA context"
            )))
        }
    }

    fn ensure_stream_owner(&self, stream: &CudaStream, label: &str) -> Result<(), CudaError> {
        if Rc::ptr_eq(&self.inner, &stream.owner) {
            Ok(())
        } else {
            Err(CudaError(format!(
                "{label}: stream belongs to a different CUDA context"
            )))
        }
    }

'''
          replace_exact(cuda, owner_anchor, owner_helpers, "CUDA context ownership helpers")

          replace_exact(
              cuda,
              r'''    ) -> Result<(), CudaError> {
        let end = dst_offset_bytes
            .checked_add(src.len())
''',
              r'''    ) -> Result<(), CudaError> {
        self.ensure_allocation_owner(dst, "copy_to_device_at")?;
        let end = dst_offset_bytes
            .checked_add(src.len())
''',
              "CUDA sync H2D owner check",
          )
          replace_exact(
              cuda,
              r'''    ) -> Result<(), CudaError> {
        let end = src_offset_bytes
            .checked_add(dst.len())
''',
              r'''    ) -> Result<(), CudaError> {
        self.ensure_allocation_owner(src, "copy_to_host_at")?;
        let end = src_offset_bytes
            .checked_add(dst.len())
''',
              "CUDA sync D2H owner check",
          )

          old_offsets = r'''        let q_coarse_ptr = q_coarse_dev.ptr + q_coarse_offset as u64;
        let q_sign_ptr = q_sign_dev.ptr + q_sign_offset as u64;
        let tiles_ptr = tiles_dev.ptr + tiles_offset as u64;
        let scores_ptr = scores_dev.ptr + scores_offset as u64;

        let grid_dim = (num_tiles as usize).div_ceil(256) as u32;
'''
          new_offsets = r'''        self.ensure_allocation_owner(q_coarse_dev, "score_tiles_at q_coarse")?;
        self.ensure_allocation_owner(q_sign_dev, "score_tiles_at q_sign")?;
        self.ensure_allocation_owner(tiles_dev, "score_tiles_at tiles")?;
        self.ensure_allocation_owner(scores_dev, "score_tiles_at scores")?;
        self.ensure_function_owner(kernel, "score_tiles_at")?;

        let n = num_tiles as usize;
        let q_coarse_bytes = crate::codec::D_C * core::mem::size_of::<f32>();
        let q_sign_bytes = crate::codec::RESIDUAL_WORDS * core::mem::size_of::<u64>();
        let tile_bytes = n
            .checked_mul(crate::codec::TILE_BYTES)
            .ok_or_else(|| CudaError("score_tiles_at: tile byte count overflow".into()))?;
        let score_bytes = n
            .checked_mul(core::mem::size_of::<f32>())
            .ok_or_else(|| CudaError("score_tiles_at: score byte count overflow".into()))?;
        let check_range = |label: &str, offset: usize, need: usize, len: usize| {
            let end = offset
                .checked_add(need)
                .ok_or_else(|| CudaError(format!("score_tiles_at: {label} range overflow")))?;
            if end > len {
                return Err(CudaError(format!(
                    "score_tiles_at: {label} offset {offset} + size {need} exceeds allocation size {len}"
                )));
            }
            Ok(())
        };
        check_range("q_coarse", q_coarse_offset, q_coarse_bytes, q_coarse_dev.len)?;
        check_range("q_sign", q_sign_offset, q_sign_bytes, q_sign_dev.len)?;
        check_range("tiles", tiles_offset, tile_bytes, tiles_dev.len)?;
        check_range("scores", scores_offset, score_bytes, scores_dev.len)?;

        let q_coarse_ptr = q_coarse_dev.ptr + q_coarse_offset as u64;
        let q_sign_ptr = q_sign_dev.ptr + q_sign_offset as u64;
        let tiles_ptr = tiles_dev.ptr + tiles_offset as u64;
        let scores_ptr = scores_dev.ptr + scores_offset as u64;

        let grid_dim = n.div_ceil(256) as u32;
'''
          replace_exact(cuda, old_offsets, new_offsets, "CUDA offset/range/context validation")

          # High-level synchronous score path.
          replace_exact(
              cuda,
              r'''        let n = num_tiles as usize;

        // Bounds-check every buffer against the kernel's read/write ranges
''',
              r'''        self.ensure_allocation_owner(q_coarse_dev, "score_tiles q_coarse")?;
        self.ensure_allocation_owner(q_sign_dev, "score_tiles q_sign")?;
        self.ensure_allocation_owner(tiles_dev, "score_tiles tiles")?;
        self.ensure_allocation_owner(scores_dev, "score_tiles scores")?;
        self.ensure_function_owner(kernel, "score_tiles")?;
        let n = num_tiles as usize;

        // Bounds-check every buffer against the kernel's read/write ranges
''',
              "CUDA score_tiles owner checks",
          )
          # Stream score path has a distinct comment after n.
          replace_exact(
              cuda,
              r'''        let n = num_tiles as usize;

        let tile_bytes = n
            .checked_mul(crate::codec::TILE_BYTES)
            .ok_or_else(|| CudaError("score_tiles_on_stream: tile byte count overflow".into()))?;
''',
              r'''        self.ensure_allocation_owner(q_coarse_dev, "score_tiles_on_stream q_coarse")?;
        self.ensure_allocation_owner(q_sign_dev, "score_tiles_on_stream q_sign")?;
        self.ensure_allocation_owner(tiles_dev, "score_tiles_on_stream tiles")?;
        self.ensure_allocation_owner(scores_dev, "score_tiles_on_stream scores")?;
        self.ensure_function_owner(kernel, "score_tiles_on_stream")?;
        self.ensure_stream_owner(stream, "score_tiles_on_stream")?;
        let n = num_tiles as usize;

        let tile_bytes = n
            .checked_mul(crate::codec::TILE_BYTES)
            .ok_or_else(|| CudaError("score_tiles_on_stream: tile byte count overflow".into()))?;
''',
              "CUDA stream score owner checks",
          )
          replace_exact(
              cuda,
              r'''    ) -> Result<(), CudaError> {
        let end = dst_offset
            .checked_add(src.len())
            .ok_or_else(|| CudaError("copy_to_device_async: offset + length overflow".into()))?;
''',
              r'''    ) -> Result<(), CudaError> {
        self.ensure_allocation_owner(dst, "copy_to_device_async")?;
        self.ensure_stream_owner(stream, "copy_to_device_async")?;
        let end = dst_offset
            .checked_add(src.len())
            .ok_or_else(|| CudaError("copy_to_device_async: offset + length overflow".into()))?;
''',
