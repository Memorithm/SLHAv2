name: PR71 refresh Cargo lock

on:
  push:
    branches:
      - feat/llama-compressed-score-quality-gate

permissions:
  contents: write

jobs:
  refresh-lock:
    if: ${{ !contains(github.event.head_commit.message, '[lock-refreshed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
      - name: Regenerate the PyO3 portion of Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p pyo3 --precise 0.24.2
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          git diff --check
      - name: Commit the generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr71-refresh-lock.yml
          git add Cargo.lock
          git commit -m "fix(deps): refresh PyO3 0.24 lockfile [lock-refreshed]"
          git push origin HEAD:feat/llama-compressed-score-quality-gate
