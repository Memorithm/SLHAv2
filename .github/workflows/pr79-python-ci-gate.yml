name: PR79 add permanent Python wheel gate

on:
  pull_request:
    branches:
      - ci/pr79-patcher

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.pull_request.head.ref == 'fix/pr71-merged-master-v3' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/pr71-merged-master-v3
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - name: Add and validate the permanent wheel gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          marker = '''      - name: AArch64 cross-check (NEON path + C-ABI crate)
          '''
          gate = '''      - name: Python binding (maturin wheel + runtime test)
            # A normal Cargo build cannot detect ABI/runtime faults in a PyO3
            # extension. Build the actual wheel, install it, and exercise every
            # codec, compute_score, strided buffers, validation errors and audit.
            run: |
              python3 -m pip install --quiet "maturin>=1.0,<2.0"
              cd slha-python
              python3 -m maturin build --release --out "$RUNNER_TEMP/wheels"
              python3 -m pip install --quiet --force-reinstall "$RUNNER_TEMP"/wheels/*.whl
              python3 -X faulthandler -u tests/test_binding.py
          '''
          if gate in text:
              raise SystemExit('Python binding gate already exists')
          count = text.count(marker)
          if count != 1:
              raise SystemExit(f'expected one AArch64 marker, found {count}')
          path.write_text(text.replace(marker, gate + marker, 1))
          PY

          python3 -m pip install --quiet "maturin>=1.0,<2.0"
          cd slha-python
          python3 -m maturin build --release --out "$RUNNER_TEMP/wheels"
          python3 -m pip install --quiet --force-reinstall "$RUNNER_TEMP"/wheels/*.whl
          python3 -X faulthandler -u tests/test_binding.py
          cd ..
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git commit -m "ci: test the installed Python wheel"
          git push origin HEAD:fix/pr71-merged-master-v3
