name: P0 bridge/backend patch v2

on:
  push:
    branches:
      - feat/elastic-architecture-v1
    paths:
      - "tools/p0_patch_head.py"
      - "tools/p0_patch_head_v2.py"
      - ".github/workflows/p0-patch-slim.yml"
      - ".github/workflows/p0-patch-slim-v2.yml"
  pull_request:
    paths:
      - "tools/p0_patch_head.py"
      - "tools/p0_patch_head_v2.py"
      - ".github/workflows/p0-patch-slim.yml"
      - ".github/workflows/p0-patch-slim-v2.yml"

permissions:
  contents: write

concurrency:
  group: p0-patch-v2-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  patch-and-check:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: feat/elastic-architecture-v1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt

      - name: Apply remaining exact audited transformations
        run: python3 tools/p0_patch_head_v2.py

      - name: Format and whitespace gate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          (cd elastic && cargo fmt --all)
          git diff --check

      - name: Root workspace compile gate
        run: cargo --locked check --workspace --all-targets --all-features

      - name: Standalone Elastic compile gate
        working-directory: elastic
        run: cargo --locked check --workspace --all-targets --all-features

      - name: Commit verified patch and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SLHAv2 CI Patch"
          git config user.email "actions@github.com"
          git rm \
            tools/p0_patch_head.py \
            tools/p0_patch_head_v2.py \
            .github/workflows/p0-patch-slim.yml \
            .github/workflows/p0-patch-slim-v2.yml
          git add -A
          git diff --cached --check
          git commit -m "fix: remove llama context cap and harden CUDA/bridge boundaries"
          git push origin HEAD:feat/elastic-architecture-v1
