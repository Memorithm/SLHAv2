name: PR79 harden C model handles v3

on:
  pull_request:
    branches:
      - ci/pr79-patcher

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.pull_request.head.ref == 'fix/pr71-merged-master-v3' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/pr71-merged-master-v3
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt,clippy
      - name: Apply validated registry transform with a valid model dimension
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ci/pr79-patcher
          git show origin/ci/pr79-patcher:.github/workflows/pr79-c-hardening-v2.yml > /tmp/source.yml
          awk '
            /python3 - <<'\''PY'\''/ { capture=1; next }
            capture && /^          PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' /tmp/source.yml > /tmp/harden.py
          sed -i 's/fitted_and_loaded_model(64, 0xA11CE)/fitted_and_loaded_model(160, 0xA11CE)/' /tmp/harden.py
          python3 /tmp/harden.py

          cargo fmt --all
          cargo check --locked -p slha-c
          cargo clippy --locked -p slha-c --all-targets -- -D warnings
          cargo test --locked -p slha-c
          bash integration/llama.cpp/shim/test_shim.sh
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add slha-c/src/lib.rs
          git commit -m "fix(c-abi): harden opaque model handles"
          git push origin HEAD:fix/pr71-merged-master-v3
