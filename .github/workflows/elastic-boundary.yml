name: Elastic ownership compatibility matrix

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "slhav2-vram/Cargo.toml"
      - "elastic/Cargo.toml"
      - "elastic/Cargo.lock"
      - "docs/integration/ELASTIC_BOUNDARY.md"
      - "docs/integration/slhav2-elastic-boundary-v1.json"
      - "scripts/verify_elastic_boundary.py"
      - ".github/workflows/elastic-boundary.yml"
  push:
    branches: [master]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "slhav2-vram/Cargo.toml"
      - "elastic/Cargo.toml"
      - "elastic/Cargo.lock"
      - "docs/integration/ELASTIC_BOUNDARY.md"
      - "docs/integration/slhav2-elastic-boundary-v1.json"
      - "scripts/verify_elastic_boundary.py"
      - ".github/workflows/elastic-boundary.yml"

permissions:
  contents: read

jobs:
  boundary:
    name: Origins, features and extraction gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install exact MSRV
        uses: dtolnay/rust-toolchain@451ce45ce31d200b52705aadd15ce75018b006de # 1.89.0
      - name: Validate manifests and lockfile
        run: python3 scripts/verify_elastic_boundary.py
      - name: Resolve default, opt-in and nested graphs
        run: |
          cargo +1.89.0 tree -p slhav2-vram --no-default-features --edges normal --locked > /tmp/slhav2-elastic-default.txt
          cargo +1.89.0 tree -p slhav2-vram --features elasticxxx --edges normal --locked > /tmp/slhav2-elastic-feature.txt
          (
            cd elastic
            cargo +1.89.0 tree --workspace --edges normal --locked
          ) > /tmp/slhav2-elastic-nested.txt
      - name: Validate origins and graph separation
        run: |
          python3 scripts/verify_elastic_boundary.py \
            --default-tree /tmp/slhav2-elastic-default.txt \
            --feature-tree /tmp/slhav2-elastic-feature.txt \
            --nested-tree /tmp/slhav2-elastic-nested.txt
      - name: Prove an unqualified external revision fails closed
        run: |
          cp /tmp/slhav2-elastic-feature.txt /tmp/slhav2-elastic-unqualified.txt
          printf '\nmemorithm-elastic v0.2.0 (git+https://github.com/Memorithm/ElasticXxx.git?rev=deadbeef#deadbeef)\n' \
            >> /tmp/slhav2-elastic-unqualified.txt
          if python3 scripts/verify_elastic_boundary.py \
            --feature-tree /tmp/slhav2-elastic-unqualified.txt; then
            echo "unqualified ElasticXxx origin was accepted" >&2
            exit 1
          fi
