[package]
name = "elastic-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Elastic resource language procedural macros: budget!, state!, policy!, transition! with real runtime semantics."
keywords = ["elastic", "macros", "dsl"]
categories = ["development-tools"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
