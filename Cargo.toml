# Cargo workspace. The real crate lives in `scirust/`; this root manifest lets
# `cargo build / test / clippy / bench` run from the repo root and operate on
# the production-facing SLHAv2 crates.
#
# The generic Elastic language/runtime is intentionally an extractable nested
# workspace rooted at `elastic/Cargo.toml`. It is excluded here so Cargo sees a
# single workspace root for every package. Root crates may still depend on
# Elastic crates through explicit path dependencies; the nested workspace has
# its own CI gates and lockfile.
[workspace]
resolver = "2"
members = [
    "scirust",
    "slha-mcp",
    "slha-c",
    "slha-python",
    "slhav2-vram",
]
exclude = ["elastic"]

# Unqualified Cargo commands intentionally target the dependency-free `scirust`
# core, preserving lightweight builds and unambiguous example/benchmark commands.
# Product-wide build and validation surfaces must pass `--workspace` explicitly.
default-members = ["scirust"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench.package.slhav2-vram]
debug = 1
