# Cargo workspace. The real crate lives in `scirust/`; this root manifest lets
# `cargo build / test / clippy / bench` run from the repo root and operate on it.
#
# (This replaces a previous *second* `scirust` package declared here, whose
#  bench and docs referenced a non-existent API — see CHANGELOG. A virtual
#  workspace removes the duplication and keeps a single source of truth.)
[workspace]
resolver = "2"
members = ["scirust", "slha-mcp", "slha-c", "slha-python", "slhav2-vram"]
# Unqualified Cargo commands intentionally target the dependency-free `scirust`
# core, preserving lightweight builds and unambiguous example/benchmark commands.
# Product-wide build and validation surfaces must pass `--workspace` explicitly.
default-members = ["scirust"]

# Release profile lives at the workspace root (a member's [profile] is ignored).
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
