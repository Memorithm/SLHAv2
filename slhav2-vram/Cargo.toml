[package]
name = "slhav2-vram"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Hardware-agnostic VRAM management and SLHAv2 tile scoring on GPU."
license = "PolyForm-Noncommercial-1.0.0"

[lib]
name = "slhav2_vram"
path = "src/lib.rs"

[dependencies]
scirust = { version = "0.2", path = "../scirust" }
scirust-modalg = { git = "https://github.com/Memorithm/scirust.git", rev = "6a9287dc3b55576f54275edf3f30d58686e3ed57", package = "scirust-modalg", optional = true }
elastic-core = { version = "0.1.0", path = "../elastic/elastic-core" }
elasticxxx = { package = "memorithm-elastic", version = "0.1.0", git = "https://github.com/Memorithm/ElasticXxx.git", rev = "4900a4ae5dfc0311bf854e20bb7e644b40342384", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }

[features]
default = []
cuda = ["libc"]
elasticxxx = ["dep:elasticxxx", "dep:scirust-modalg"]

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "score"
harness = false
