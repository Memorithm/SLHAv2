[package]
name = "slhav2-vram"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Hardware-agnostic VRAM management and SLHAv2 tile scoring on GPU."
license = "PolyForm-Noncommercial-1.0.0"

[lib]
name = "slhav2_vram"
path = "src/lib.rs"

[dependencies]
scirust = { version = "0.2", path = "../scirust" }
elastic-core = { version = "0.1.0", path = "../elastic/elastic-core" }
elasticxxx = { package = "memorithm-elastic", version = "0.1.0", git = "https://github.com/Memorithm/ElasticXxx.git", rev = "354cfb372f568338b29a357b0671bf9315097b1d", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }

[features]
default = []
cuda = ["libc"]
elasticxxx = ["dep:elasticxxx"]

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "score"
harness = false
