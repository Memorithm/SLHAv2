[package]
name = "slhav2-vram"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Hardware-agnostic VRAM management and SLHAv2 tile scoring on GPU."
license = "PolyForm-Noncommercial-1.0.0"

[lib]
name = "slhav2_vram"
path = "src/lib.rs"

[dependencies]
scirust = { version = "0.2", path = "../scirust" }
elastic-core = { version = "0.1.0", path = "../elastic/elastic-core" }
elasticxxx-core = { package = "elastic-core", version = "0.1.0", git = "https://github.com/Memorithm/ElasticXxx.git", rev = "70aff3e993239037466a784b2a643c630f151e49", optional = true }
elasticxxx-eir = { package = "elastic-eir", version = "0.1.0", git = "https://github.com/Memorithm/ElasticXxx.git", rev = "70aff3e993239037466a784b2a643c630f151e49", optional = true }
elasticxxx-kv = { package = "elastic-kv", version = "0.1.0", git = "https://github.com/Memorithm/ElasticXxx.git", rev = "70aff3e993239037466a784b2a643c630f151e49", optional = true }
elasticxxx-runtime = { package = "elastic-runtime", version = "0.1.0", git = "https://github.com/Memorithm/ElasticXxx.git", rev = "70aff3e993239037466a784b2a643c630f151e49", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }

[features]
default = []
cuda = ["libc"]
elasticxxx = ["dep:elasticxxx-core", "dep:elasticxxx-eir", "dep:elasticxxx-kv", "dep:elasticxxx-runtime"]

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "score"
harness = false
